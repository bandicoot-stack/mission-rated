test_signal].filter(Boolean);document.getElementById('grid').innerHTML='<section class="card"><h2>Public rating evidence</h2>'+(pr?'<div class="rating"><b>'+esc(pr.rating)+'</b>/'+esc(pr.scale||5)+'</div><div class="muted">'+esc(pr.source_name||'External source')+(pr.sample_size?' • '+esc(pr.sample_size)+' reviews':'')+'</div>'+(safe(pr.source_url)?'<a class="source" target="_blank" rel="noopener noreferrer" href="'+safe(pr.source_url)+'">Open rating source ↗</a>':''):'<div class="muted">No current public rating signal tracked.</div>')+'</section><section class="card"><h2>Support resources</h2>'+sigs.map(s=>'<div class="signal"><b>'+esc(s.label||s.key||'Support signal')+'</b><br>'+esc([s.text,s.value!=null?[s.value,s.unit].filter(Boolean).join(' '):''].filter(Boolean).join(' • '))+(safe(s.source_url)?'<br><a class="source" target="_blank" rel="noopener noreferrer" href="'+safe(s.source_url)+'">Open source ↗</a>':'')+'</div>').join('')+'</section>'}catch(e){document.getElementById('name').textContent='Installation unavailable';document.getElementById('grid').innerHTML='<div class="empty">This installation could not be loaded.</div>'}})();</script><script src="/feedback.js" defer></script></body></html>
