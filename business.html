<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mission Rated sourced business details, military benefits, public ratings and trust provenance.">
<title>Business — Mission Rated</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#02101d;color:#f5f8fa;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:980px;margin:auto;padding:0 18px}.top{border-bottom:1px solid #21445a;background:#03111f}.top .wrap{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:950;letter-spacing:.12em}.brand b,.cyan,a{color:#00e5ff}.nav a{font-size:9px;text-decoration:none;border:1px solid #365e73;border-radius:999px;padding:7px 9px;margin-left:5px}.hero{padding:34px 0 18px;background:radial-gradient(circle at 84% 10%,#214b64,transparent 36%)}.eyebrow{font-size:9px;font-weight:950;color:#00e5ff;letter-spacing:.12em}h1{font-size:38px;line-height:1;margin:7px 0}.muted{font-size:10px;line-height:1.5;color:#9fb5bf}.main{padding:18px 0 45px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:11px}.card{background:#061a29;border:1px solid #2b536a;border-radius:13px;padding:15px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.badge{font-size:8px;font-weight:900;border:1px solid #47697a;border-radius:999px;padding:5px 7px}.official{border-color:#2f8a73;color:#8ff2d0}.user{border-color:#6e59aa;color:#d4c5ff}.building{border-color:#8b7224;color:#ffd978}.value{border-color:#7b672f;color:#ffd36d;background:#1a1b17}.metric{font-size:30px;font-weight:950;color:#ffd36d}.line{padding:9px 0;border-top:1px solid #244759;font-size:10px;line-height:1.45}.line b{display:block;font-size:9px;color:#95abb5;margin-bottom:3px}.offer{border-left:3px solid #00d9ed;background:#041522;padding:10px;margin-top:8px}.offer h3{font-size:12px;margin:0 0 4px}.offer p{font-size:9px;color:#b4c5cc;margin:4px 0}.link{display:inline-flex;margin-top:8px;border:1px solid #39708a;border-radius:999px;padding:7px 10px;text-decoration:none;font-size:9px;font-weight:900}.empty{padding:22px;text-align:center;color:#8ca4ae}.status{font-size:9px;color:#8ea5af}@media(max-width:700px){.grid{grid-template-columns:1fr}h1{font-size:33px}.top .wrap{padding-top:8px;padding-bottom:8px;align-items:flex-start;flex-direction:column}.nav a{margin:0 5px 0 0}.link{min-height:40px;align-items:center}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><div class="brand">MISSION <b>RATED</b></div><nav class="nav"><a href="/">Explorer</a><a href="/military-value">Save</a><a href="/?view=support">Support</a></nav></div></header>
<section class="hero"><div class="wrap"><div class="eyebrow">SOURCED BUSINESS INTELLIGENCE</div><h1 id="name">Loading…</h1><div class="muted" id="sub">Checking live Mission Rated evidence.</div></div></section>
<main class="main"><div class="wrap"><div id="status" class="status">Loading business data…</div><div id="content"></div></div></main>
<script>
(async()=>{
 const API='https://vquwdypidgjmxnhhdbol.supabase.co/functions/v1/public-explore';
 const id=new URLSearchParams(location.search).get('id');
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const safe=u=>/^https:\/\//i.test(String(u||''))?String(u):'';
 const date=v=>v?new Date(v).toLocaleDateString():'';
 const validRating=p=>p?.rating!=null&&safe(p?.source_url)&&Number(p?.sample_size)>0;
 try{
  const r=await fetch(API,{headers:{accept:'application/json'}});if(!r.ok)throw Error(r.status);
  const j=await r.json(),b=(j.businesses||[]).find(x=>x.id===id);if(!b)throw Error('not_found');
  document.title=`${b.name} — Mission Rated`;document.getElementById('name').textContent=b.name;document.getElementById('sub').textContent=[b.category,b.city,b.state].filter(Boolean).join(' • ');
  const deals=(j.deals||[]).filter(x=>x.business_id===b.id&&safe(x.source_url)).sort((a,z)=>(Number(z.military_value_weight)||0)-(Number(a.military_value_weight)||0)||(Date.parse(z.verified_at||0)||0)-(Date.parse(a.verified_at||0)||0));
  const pr=validRating(b.public_rating)?b.public_rating:null;
  document.getElementById('status').textContent='Live sourced data loaded.';
  document.getElementById('content').innerHTML=`<div class="grid"><section class="card"><div class="badges"><span class="badge building">MR ${b.mission_score_status==='rated'&&b.mission_score!=null?esc(b.mission_score):'Building'}</span>${b.official_verified?'<span class="badge official">◆ Official Source Verified</span>':''}${b.community_verified?'<span class="badge user">◆ User Verified</span>':''}</div><div class="metric">${b.mission_score_status==='rated'&&b.mission_score!=null?esc(b.mission_score):'BUILDING'}</div><div class="muted">Mission Rated score stays Building until enough defensible Mission Rated evidence exists.</div>${pr?`<div class="line"><b>SOURCED PUBLIC RATING</b><strong>${esc(pr.rating)}/${esc(pr.scale||5)}</strong> • ${esc(pr.sample_size)} reviews${pr.observed_at?` • observed ${esc(date(pr.observed_at))}`:''}<br><a href="${esc(pr.source_url)}" target="_blank" rel="noopener noreferrer">${esc(pr.source_name||'Public rating source')} ↗</a></div>`:'<div class="line"><b>PUBLIC RATING</b>No qualifying sourced external rating currently stored.</div>'}<div class="line"><b>OFFICIAL WEBSITE</b>${safe(b.website_url)?`<a href="${esc(b.website_url)}" target="_blank" rel="noopener noreferrer">Visit official business website ↗</a>`:'Not yet available.'}</div><div class="line"><b>PROVENANCE SOURCE</b>${safe(b.source_url)?`<a href="${esc(b.source_url)}" target="_blank" rel="noopener noreferrer">Open stored source ↗</a>${b.source_checked_at?` • checked ${esc(date(b.source_checked_at))}`:''}`:'Source pending.'}</div></section><section class="card"><h2 style="margin-top:0">Military value</h2><div class="muted">Strongest verified benefit first. Each offer remains MR Building until Mission Rated has native evidence for an offer-level score.</div>${deals.length?deals.map(d=>`<div class="offer"><h3>${esc(d.title)}</h3>${d.offer_value_text?`<p><b>${esc(d.offer_value_text)}</b></p>`:''}${d.description?`<p>${esc(d.description)}</p>`:''}${d.terms?`<p>${esc(d.terms)}</p>`:''}<div class="badges"><span class="badge building">MR Building</span>${Number(d.military_value_weight)>0?`<span class="badge value">Military value ${esc(d.military_value_weight)}</span>`:''}${d.official_verified?'<span class="badge official">Official Source Verified</span>':''}${d.community_verified?'<span class="badge user">User Verified</span>':''}</div><p>${d.verified_at?`Verified ${esc(date(d.verified_at))}`:''}${d.ends_at?` • ends ${esc(date(d.ends_at))}`:''}</p><a class="link" href="${esc(d.source_url)}" target="_blank" rel="noopener noreferrer">Verify offer source ↗</a></div>`).join(''):'<div class="empty">No active sourced military offer currently listed.</div>'}</section></div>`;
 }catch(e){document.getElementById('name').textContent='Business unavailable';document.getElementById('status').textContent='Could not load this business.';document.getElementById('content').innerHTML='<div class="card empty">Return to <a href="/">Mission Rated Live</a>.</div>'}
})();
</script>
<script src="/feedback.js" defer></script>
<script src="/lifestyle-nav.js" defer></script>
</body>
</html>
