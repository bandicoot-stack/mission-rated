name: Mission Rated beta feedback
description: Tell us what worked, what was missing, or what made a PCS/local decision harder.
title: "[Beta feedback] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Mission Rated. Please do not include sensitive personal information.
  - type: dropdown
    id: outcome
    attributes:
      label: Did Mission Rated help you complete what you came to do?
      options:
        - Yes
        - Partly
        - No
    validations:
      required: true
  - type: textarea
    id: mission
    attributes:
      label: What were you trying to find or decide?
      placeholder: Example: compare school districts near Naval Station Norfolk
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What was missing, wrong, confusing, or especially useful?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or item
      description: Paste the page URL or name the business, school, deal, or installation.
  - type: dropdown
    id: pcs
    attributes:
      label: Would you use Mission Rated during a PCS?
      options:
        - Yes
        - Maybe
        - No
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include sensitive personal information.
          required: true
