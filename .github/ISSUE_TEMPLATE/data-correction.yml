name: Report incorrect or outdated data
description: Flag a business, school, military discount, installation signal, or source that needs review.
title: "[Data correction] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Help us keep Mission Rated trustworthy. Please include a source link when you have one and do not include sensitive personal information.
  - type: dropdown
    id: type
    attributes:
      label: What needs correction?
      options:
        - Business listing
        - Military discount or offer
        - School information
        - Installation / base information
        - Source or citation
        - Other
    validations:
      required: true
  - type: input
    id: item
    attributes:
      label: Business, school, installation, or item name
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or outdated?
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Better source (optional)
      description: Paste an authoritative or first-party URL if available.
  - type: input
    id: page
    attributes:
      label: Mission Rated page URL (optional)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I did not include sensitive personal information.
          required: true
