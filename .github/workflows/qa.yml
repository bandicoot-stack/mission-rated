name: Mission Rated QA

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build production artifact
        run: npm run build
      - name: Validate release files and trust-safe HTML
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path('.')
          dist = root / 'dist'
          html_names = ['index.html', 'military-value.html', 'schools.html', 'bases.html']
          core = html_names + ['sitemap.xml', 'robots.txt', 'feedback.js', 'rankings.js']
          errors = []

          for name in core:
              if not (root / name).is_file():
                  errors.append(f'missing source release file: {name}')
              if not (dist / name).is_file():
                  errors.append(f'missing built release file: dist/{name}')

          try:
              json.loads((root / 'vercel.json').read_text())
          except Exception as exc:
              errors.append(f'invalid vercel.json: {exc}')

          try:
              rel = json.loads((dist / 'release.json').read_text())
              if not rel.get('git_sha'):
                  errors.append('dist/release.json missing git_sha')
          except Exception as exc:
              errors.append(f'invalid dist/release.json: {exc}')

          feedback = (root / 'feedback.js').read_text(encoding='utf-8') if (root / 'feedback.js').exists() else ''
          rankings = (root / 'rankings.js').read_text(encoding='utf-8') if (root / 'rankings.js').exists() else ''
          if 'submit-beta-feedback' not in feedback:
              errors.append('feedback.js missing submit-beta-feedback endpoint')
          if 'mrFeedbackButton' not in feedback:
              errors.append('feedback.js missing feedback control')
          if 'MR OPEN' not in rankings or 'businessOpen' not in rankings or 'baseOpen' not in rankings or 'schoolOpen' not in rankings:
              errors.append('rankings.js missing transparent MR ranking logic')

          for name in html_names:
              built = (dist / name).read_text(encoding='utf-8') if (dist / name).exists() else ''
              if '/feedback.js' not in built:
                  errors.append(f'dist/{name} missing feedback.js')
              if '/rankings.js' not in built:
                  errors.append(f'dist/{name} missing rankings.js')

          html_files = sorted(root.glob('*.html'))
          for path in html_files:
              text = path.read_text(encoding='utf-8')
              low = text.lower()
              if '<html' not in low or 'lang="en"' not in low:
                  errors.append(f'{path}: missing html lang="en"')
              if 'name="viewport"' not in low:
                  errors.append(f'{path}: missing viewport meta')
              if 'http://' in low:
                  errors.append(f'{path}: contains insecure http:// URL')

              for match in re.finditer(r'<a\b[^>]*target=["\']_blank["\'][^>]*>', text, flags=re.I):
                  tag = match.group(0).lower()
                  if 'rel="noopener noreferrer"' not in tag and "rel='noopener noreferrer'" not in tag:
                      errors.append(f'{path}: target=_blank link missing noopener noreferrer')

              for attr, target in re.findall(r'\b(href|src)=["\']([^"\']+)["\']', text, flags=re.I):
                  if '${' in target:
                      continue
                  if target.startswith(('#', 'https://', 'mailto:', 'tel:', 'data:', 'javascript:')):
                      continue
                  clean = target.split('#', 1)[0].split('?', 1)[0].lstrip('/')
                  if clean and not (root / clean).exists():
                      errors.append(f'{path}: broken local {attr} target {target}')

          if errors:
              print('Mission Rated static QA failed:')
              for error in sorted(set(errors)):
                  print(f' - {error}')
              sys.exit(1)

          print(f'Mission Rated QA passed for {len(html_files)} HTML pages, feedback controls, MR rankings, and deterministic Vercel artifact.')
          PY
