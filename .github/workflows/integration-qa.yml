name: Mission Rated Integration QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mission-rated-integration-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build release
        run: npm run build
      - name: Validate integrated Mission Rated Live paths
        run: node scripts/qa-integration.mjs
