name: Mission Rated Production Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mission-rated-production
  cancel-in-progress: true

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Vercel production to publish this commit
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          RELEASE_URL: https://www.missionratedhq.com/release.json
        run: |
          set -euo pipefail
          echo "Waiting for production SHA $EXPECTED_SHA"
          for attempt in $(seq 1 24); do
            body="$(curl -fsS --max-time 10 -H 'Cache-Control: no-cache' "$RELEASE_URL?check=$EXPECTED_SHA" 2>/dev/null || true)"
            live_sha="$(printf '%s' "$body" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("git_sha", ""))' 2>/dev/null || true)"
            if [ "$live_sha" = "$EXPECTED_SHA" ]; then
              echo "Production verified at $EXPECTED_SHA"
              exit 0
            fi
            echo "Attempt $attempt/24: production reports '${live_sha:-no release marker yet}'"
            sleep 15
          done
          echo "Production did not converge to GitHub SHA $EXPECTED_SHA within 6 minutes."
          echo "Check Vercel project Git connection: bandicoot-stack/mission-rated, production branch main."
          exit 1

      - name: Smoke test production routes
        shell: bash
        run: |
          set -euo pipefail
          for path in / /featured /instagram-connect /local-intel /assets/partners/yorktown-tools/logo.webp /military-value /schools /bases /support /medical /events /buy-a-car /sources /release.json; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 10 "https://www.missionratedhq.com$path")"
            test "$code" = "200" || { echo "$path returned $code"; exit 1; }
          done
          echo "Production route smoke test passed."

      - name: Install Chromium visual test runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Visual QA production landing page
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/visual-qa.cjs <<'EOF'
          const { chromium } = require('playwright');

          const base = 'https://www.missionratedhq.com';
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];

          function assertLogo(state, label) {
            if (state.hostState !== 'loaded') throw new Error(`${label}: partner logo renderer state is ${state.hostState || 'missing'}`);
            if (!state.complete || state.naturalWidth <= 0 || state.naturalHeight <= 0) throw new Error(`${label}: partner logo did not decode`);
            if (!state.visible) throw new Error(`${label}: partner logo has no visible layout box`);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            try {
              for (const vp of viewports) {
                const page = await browser.newPage({ viewport: { width: vp.width, height: vp.height } });
                await page.goto(`${base}/?visual_qa=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
                await page.waitForTimeout(1200);

                const state = await page.evaluate(() => {
                  const visible = el => {
                    if (!el) return false;
                    const s = getComputedStyle(el);
                    const r = el.getBoundingClientRect();
                    return s.display !== 'none' && s.visibility !== 'hidden' && Number(s.opacity || 1) > 0 && r.width > 0 && r.height > 0;
                  };
                  const hasVisibleText = (root, pattern) => {
                    if (!root) return false;
                    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
                    let node;
                    while ((node = walker.nextNode())) {
                      const text = (node.textContent || '').trim();
                      const parent = node.parentElement;
                      if (text && pattern.test(text) && visible(parent)) return true;
                    }
                    return false;
                  };
                  const logoState = slug => {
                    const host = document.querySelector(`[data-partner-logo="${slug}"]`);
                    const img = host?.querySelector('img');
                    const rect = img?.getBoundingClientRect();
                    return {
                      hostState: host?.dataset.partnerLogoState || '',
                      complete: Boolean(img?.complete),
                      naturalWidth: img?.naturalWidth || 0,
                      naturalHeight: img?.naturalHeight || 0,
                      visible: Boolean(img && visible(img) && rect.width > 0 && rect.height > 0),
                    };
                  };
                  const active = document.querySelector('.tab.active')?.textContent?.trim() || '';
                  const featured = document.getElementById('featured');
                  return {
                    active,
                    featuredVisible: visible(featured),
                    yorktown: hasVisibleText(featured, /Yorktown Tools/i),
                    huntClub: hasVisibleText(featured, /Hunt Club Farm/i),
                    todayHero: hasVisibleText(document.body, /How to save money today\./i),
                    logo: logoState('yorktown-tools'),
                  };
                });

                console.log(vp.name, state);
                if (!/Featured Partners/i.test(state.active)) throw new Error(`${vp.name}: Featured Partners is not the active landing tab`);
                if (!state.featuredVisible) throw new Error(`${vp.name}: Featured section is not visible`);
                if (!state.yorktown) throw new Error(`${vp.name}: Yorktown Tools is not visible in Featured`);
                if (!state.huntClub) throw new Error(`${vp.name}: Hunt Club Farm is not visible in Featured`);
                if (state.todayHero) throw new Error(`${vp.name}: Today's Deals promo is visibly rendered above Featured landing`);
                assertLogo(state.logo, `${vp.name} homepage`);

                await page.goto(`${base}/featured?visual_qa=${Date.now()}`, { waitUntil: 'networkidle', timeout: 60000 });
                await page.waitForTimeout(500);
                const featuredPageLogo = await page.evaluate(() => {
                  const host = document.querySelector('[data-partner-logo="yorktown-tools"]');
                  const img = host?.querySelector('img');
                  const style = img ? getComputedStyle(img) : null;
                  const rect = img?.getBoundingClientRect();
                  return {
                    hostState: host?.dataset.partnerLogoState || '',
                    complete: Boolean(img?.complete),
                    naturalWidth: img?.naturalWidth || 0,
                    naturalHeight: img?.naturalHeight || 0,
                    visible: Boolean(img && style?.display !== 'none' && style?.visibility !== 'hidden' && rect.width > 0 && rect.height > 0),
                  };
                });
                assertLogo(featuredPageLogo, `${vp.name} featured page`);

                await page.close();
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF
          NODE_PATH="$PWD/node_modules" node /tmp/visual-qa.cjs
          echo "Visual production QA passed at mobile and desktop viewports; visible-content assertions are scoped to rendered text nodes."

      - name: Record immutable production release audit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          day="$(date -u +%F)"
          verified_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          report_path="reports/${day}/${GITHUB_SHA}.md"

          if gh api "repos/${GITHUB_REPOSITORY}/contents/${report_path}?ref=release-audit" >/dev/null 2>&1; then
            echo "Release audit already exists for ${GITHUB_SHA}; leaving immutable report unchanged."
            exit 0
          fi

          cat > /tmp/release-audit.md <<EOF
          # Mission Rated Production Release Report

          - **Production SHA:** \`${GITHUB_SHA}\`
          - **Verified at:** ${verified_at}
          - **GitHub Actions run:** https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - **Commit:** https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}
          - **Production:** https://www.missionratedhq.com
          - **Workflow:** Mission Rated Production Verification
          - **Trigger:** ${GITHUB_EVENT_NAME}
          - **Actor:** ${GITHUB_ACTOR}

          ## Verification evidence

          - [x] Production \`/release.json\` converged to the exact GitHub SHA.
          - [x] Required production route smoke tests returned HTTP 200.
          - [x] Mobile visual QA passed at 390x844.
          - [x] Desktop visual QA passed at 1440x1000.
          - [x] Yorktown Tools partner logo decoded and rendered on homepage and Featured page.
          - [x] Hunt Club Farm rendered inside the Featured Partners landing surface.
          - [x] Featured Partners remained the active production landing surface expected by the release test.

          ## Discipline declaration

          This report was generated only after every preceding production-verification step in the same workflow job succeeded. A failed or incomplete production verification cannot produce this success report.

          The audit is stored on the dedicated \`release-audit\` branch so recording evidence cannot trigger another production deployment from \`main\`.
          EOF

          encoded="$(base64 -w0 /tmp/release-audit.md)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${report_path}" \
            -f message="audit: production ${GITHUB_SHA}" \
            -f content="$encoded" \
            -f branch="release-audit" >/dev/null
          echo "Recorded ${report_path} on release-audit."
